<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>DFG social card</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #0a0c10;
      color: #e9ebef;
      font-family: Arial, sans-serif;
      width: 1200px;
      height: 630px;
      padding: 64px;
      position: relative;
    }
    header {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    header span {
      font-size: 18px;
      font-weight: normal;
      color: #aeb4bf;
      margin-left: 20px;
      letter-spacing: 0;
    }
    .line {
      width: 72px;
      height: 3px;
      background: #f2b441;
      margin-top: 72px;
    }
    h1 {
      font-size: 60px;
      line-height: 1.14;
      letter-spacing: -2px;
      font-weight: 500;
      margin: 28px 0;
      max-width: 950px;
    }
    p {
      font-size: 24px;
      color: #aeb4bf;
    }
    footer {
      position: absolute;
      bottom: 48px;
      font-size: 18px;
      color: #f2b441;
    }
  </style>
  <body>
    <header>DFG <span>Digital Frontiers Group</span></header>
    <div class="line"></div>
    <h1>AI investment. Fintech launches.<br />Customer security reviews.</h1>
    <p>Independent advice for your next decision.</p>
    <footer>dfg.consulting</footer>
  </body>
</html>
