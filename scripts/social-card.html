<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>DFG social card</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #0a0c10;
      color: #e9ebef;
      font-family: "Geist", Arial, sans-serif;
      width: 1200px;
      height: 630px;
      padding: 64px;
      position: relative;
    }
    header {
      font-family: "Unbounded", Arial, sans-serif;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    header span {
      font-family: "Geist", Arial, sans-serif;
      font-size: 18px;
      font-weight: normal;
      color: #aeb4bf;
      margin-left: 20px;
      letter-spacing: 0;
    }
    .line {
      width: 72px;
      height: 3px;
      background: #f2b441;
      margin-top: 72px;
    }
    h1 {
      font-family: "Unbounded", Arial, sans-serif;
      font-size: 56px;
      line-height: 1.16;
      letter-spacing: -1.5px;
      font-weight: 500;
      margin: 28px 0;
      max-width: 950px;
    }
    p {
      font-size: 24px;
      color: #aeb4bf;
    }
    footer {
      font-family: "Geist Mono", monospace;
      position: absolute;
      bottom: 48px;
      font-size: 18px;
      color: #f2b441;
    }
  </style>
  <body>
    <header>DFG <span>Digital Frontiers Group</span></header>
    <div class="line"></div>
    <h1>Independent advisory for<br />AI, fintech and cybersecurity.</h1>
    <p>AI strategy · IT strategy · Fintech and payments · Cybersecurity</p>
    <footer>dfg.consulting</footer>
  </body>
</html>
